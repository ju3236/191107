<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>잿빛 등대</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Oswald:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ===================== 1. 메인 화면 ===================== -->
  <section id="screen-home" class="screen active">
    <div class="home-bg"></div>
    <div class="home-art" id="home-art"></div>

    <div class="home-icons">
      <button class="icon-btn" id="btn-settings" aria-label="설정"></button>
      <button class="icon-btn" id="btn-notice" aria-label="세계관 소개"></button>
      <button class="icon-btn" id="btn-archive" aria-label="기록"></button>
      <button class="icon-btn hidden" id="btn-fullscreen" aria-label="전체 화면"></button>
    </div>

    <div class="home-side">
      <div class="home-banner" id="home-banner"></div>
      <div class="home-level">
        <div class="lv-ring"><b id="home-lv">1</b><small>LV</small></div>
      </div>
      <div class="home-name"><b id="home-name"></b><small id="home-id"></small></div>
      <button class="home-voice" id="home-voice">
        <span class="voice-tag">VOICE</span>
        <span id="home-voice-text"></span>
      </button>
    </div>

    <div class="home-panel">
      <div class="hp-top">
        <span class="hp-clock" id="home-clock"></span>
        <div class="resbar" data-resbar></div>
      </div>
      <button class="tile tile-terminal" data-go="operations">
        <div class="tt-gauge">
          <div class="tt-num" id="home-progress">0</div>
          <div class="tt-sub" id="home-progress-max">/3</div>
          <div class="tt-cap">CLEAR</div>
        </div>
        <div class="tt-body">
          <div class="tile-en">TERMINAL</div>
          <div class="tile-ko">작전</div>
          <div class="tt-current"><span class="chip">현재</span><span id="home-current"></span></div>
        </div>
      </button>
      <button class="tile tile-is" data-go="is"><span class="tile-ico is-ico">≋</span><span><span class="tile-en">INTEGRATED STRATEGIES</span><span class="tile-ko">통합전략</span></span><span class="tile-is-sub" id="home-is"></span></button>
      <div class="tile-row">
        <button class="tile" data-go="formation"><span class="tile-ico" data-ico="users"></span><span><span class="tile-en">SQUADS</span><span class="tile-ko">편성</span></span></button>
        <button class="tile" data-go="roster"><span class="tile-ico" data-ico="guard"></span><span><span class="tile-en">OPERATOR</span><span class="tile-ko">오퍼레이터</span></span></button>
      </div>
      <div class="tile-row">
        <button class="tile tile-store" data-go="store"><span class="tile-ico" data-ico="store"></span><span><span class="tile-en">STORE</span><span class="tile-ko">구매센터</span></span></button>
        <button class="tile tile-accent" data-go="headhunt"><span class="tile-ico" data-ico="headhunt"></span><span><span class="tile-en">HEADHUNT</span><span class="tile-ko">헤드헌팅</span></span></button>
      </div>
      <div class="tile-row">
        <button class="tile" data-go="depot"><span class="tile-ico" data-ico="depot"></span><span><span class="tile-en">DEPOT</span><span class="tile-ko">창고</span></span></button>
        <button class="tile" id="tile-archive"><span class="tile-ico" data-ico="book"></span><span><span class="tile-en">ARCHIVES</span><span class="tile-ko">기록</span></span></button>
        <button class="tile tile-admin hidden" id="tile-admin" data-go="admin"><span class="tile-ico" data-ico="admin"></span><span><span class="tile-en">ADMIN</span><span class="tile-ko">관리자</span></span></button>
      </div>
    </div>
  </section>

  <!-- ===================== 2. 오퍼레이터 목록 ===================== -->
  <section id="screen-roster" class="screen light">
    <header class="topbar">
      <div class="nav-group">
        <button class="nav-btn" data-back aria-label="뒤로"></button>
        <button class="nav-btn home" data-go="home" aria-label="메인 화면"></button>
      </div>
      <div class="sort-bar" id="sort-bar">
        <span class="sort-ico" aria-hidden="true">♜</span>
        <button data-sort="rarity" class="on">레어도</button>
        <button data-sort="trust">신뢰도</button>
        <button data-sort="cost">코스트</button>
        <button data-sort="class">직군</button>
      </div>
    </header>
    <div class="roster-body" id="roster-body">
      <div class="op-grid rgrid" id="op-grid"></div>
      <nav class="class-filter" id="class-filter"></nav>
    </div>
  </section>

  <!-- ===================== 3. 오퍼레이터 상세 ===================== -->
  <section id="screen-detail" class="screen">
    <div class="detail-bg" id="detail-bg"></div>
    <div class="detail-art" id="detail-art"></div>
    <header class="topbar dark">
      <div class="nav-group">
        <button class="nav-btn" data-back aria-label="뒤로"></button>
        <button class="nav-btn home" data-go="home" aria-label="메인 화면"></button>
      </div>
      <div class="nav-group">
        <button class="nav-btn" id="detail-prev" aria-label="이전 오퍼레이터">‹</button>
        <button class="nav-btn" id="detail-next" aria-label="다음 오퍼레이터">›</button>
      </div>
    </header>

    <div class="train-view hidden" id="train-view"></div>
    <div class="detail-left">
      <div class="stat-head">스탯 <span>»</span></div>
      <div class="stat-grid" id="detail-stats"></div>
      <div class="trust">
        <div class="trust-head"><b>저지 가능 수</b><span id="detail-block"></span></div>
      </div>
      <div class="detail-stars"><span id="detail-stars"></span><span class="detail-pot" id="detail-pot"></span></div>
      <div class="detail-en" id="detail-en"></div>
      <div class="detail-name" id="detail-name"></div>
      <div class="detail-bottom">
        <div class="class-box" id="detail-class"></div>
        <div class="range-box"><div id="detail-range"></div><small>공격 범위</small></div>
        <div class="tag-col" id="detail-tags"></div>
      </div>
    </div>

    <div class="detail-right">
      <div class="lv-widget" id="detail-lv"></div><span id="detail-cost" hidden></span>
      <div class="info-card">
        <div class="info-title">스킬</div>
        <div class="skill-list" id="detail-skill"></div>
      </div>
      <div class="info-card">
        <div class="info-title">특성 · 재능</div>
        <div id="detail-talents"></div>
      </div>
      <div class="info-card">
        <div class="info-title" id="detail-race"></div>
        <p class="profile" id="detail-profile"></p>
        <p class="quote" id="detail-quote"></p>
      </div>
      <div class="detail-btns"><button class="btn" id="detail-skin">의상</button><button class="btn" id="detail-voice">음성 기록</button><button class="btn primary" id="detail-assist">비서로 지정</button></div>
    </div>
  </section>

  <!-- ===================== 4. 편성 ===================== -->
  <section id="screen-formation" class="screen light">
    <header class="topbar">
      <div class="nav-group">
        <button class="nav-btn" data-back aria-label="뒤로"></button>
        <button class="nav-btn home" data-go="home" aria-label="메인 화면"></button>
        <span class="topbar-title" id="formation-title">편성</span>
      </div>
      <div class="nav-group">
        <button class="quick-btn" id="btn-quick"><span data-ico="userplus"></span>빠른 편성</button>
        <button class="trash-btn" id="btn-clear" aria-label="편성 비우기"><span data-ico="trash"></span></button>
      </div>
    </header>
    <div class="formation-body">
      <div class="slot-grid" id="slot-grid"></div>
      <button class="start-btn" id="formation-start">
        <span class="start-tri"></span>
        <b>작전<br>개시</b>
        <small>OPERATION START</small>
      </button>
    </div>
    <div class="formation-foot" id="formation-foot"></div>
  </section>

  <!-- ===================== 5. 작전 목록 ===================== -->
  <section id="screen-operations" class="screen">
    <div class="ops-bg"><div class="ink"></div><div class="skyline"></div></div>
    <header class="topbar dark">
      <div class="nav-group">
        <button class="nav-btn" data-back aria-label="뒤로"></button>
        <button class="nav-btn home" data-go="home" aria-label="메인 화면"></button>
      </div>
      <div class="chapter-title" id="chapter-title"></div>
    </header>
    <div class="ops-map" id="ops-map"></div>
    <aside class="ops-panel" id="ops-panel"></aside>
  </section>

  <!-- ===================== 구매센터 ===================== -->
  <section id="screen-store" class="screen light">
    <header class="topbar">
      <div class="nav-group">
        <button class="nav-btn" data-back aria-label="뒤로"></button>
        <button class="nav-btn home" data-go="home" aria-label="메인 화면"></button>
        <span class="topbar-title">구매센터</span>
      </div>
      <div class="resbar dark-res" data-resbar></div>
    </header>
    <div class="store-body">
      <nav class="store-tabs" id="store-tabs"></nav>
      <div class="store-main" id="store-main"></div>
    </div>
    <div class="outfit-view hidden" id="outfit-view"></div>
  </section>

  <!-- ===================== 헤드헌팅 ===================== -->
  <section id="screen-headhunt" class="screen">
    <div class="hh-bg"></div>
    <header class="topbar dark">
      <div class="nav-group">
        <button class="nav-btn" data-back aria-label="뒤로"></button>
        <button class="nav-btn home" data-go="home" aria-label="메인 화면"></button>
      </div>
      <div class="resbar" data-resbar></div>
    </header>
    <div class="hh-body">
      <nav class="hh-banners" id="hh-banners"></nav>
      <div class="hh-main" id="hh-main"></div>
    </div>
  </section>

  <!-- ===================== 창고 ===================== -->
  <section id="screen-depot" class="screen light">
    <header class="topbar">
      <div class="nav-group">
        <button class="nav-btn" data-back aria-label="뒤로"></button>
        <button class="nav-btn home" data-go="home" aria-label="메인 화면"></button>
        <span class="topbar-title">창고</span>
      </div>
    </header>
    <div class="depot-grid" id="depot-grid"></div>
  </section>

  <!-- ===================== 관리자 ===================== -->
  <section id="screen-admin" class="screen">
    <header class="topbar dark">
      <div class="nav-group">
        <button class="nav-btn" data-back aria-label="뒤로"></button>
        <button class="nav-btn home" data-go="home" aria-label="메인 화면"></button>
        <span class="topbar-title light-title">관리자</span>
      </div>
    </header>
    <div class="admin-body">
      <nav class="admin-tabs" id="admin-tabs"></nav>
      <div class="admin-main" id="admin-main"></div>
    </div>
  </section>

  <!-- ===================== 통합전략 ===================== -->
  <section id="screen-is" class="screen is-screen">
    <div class="is-bg"></div>
    <header class="topbar dark">
      <div class="nav-group">
        <button class="nav-btn" data-back aria-label="뒤로"></button>
        <button class="nav-btn home" data-go="home" aria-label="메인 화면"></button>
        <span class="topbar-title light-title">통합전략</span>
      </div>
    </header>
    <div class="is-hub" id="is-hub"></div>
  </section>
  <section id="screen-isrun" class="screen is-screen">
    <div class="is-bg"></div>
    <header class="is-top" id="is-top"></header>
    <div class="is-map-wrap"><div class="is-map" id="is-map"></div></div>
    <footer class="is-bottom" id="is-bottom"></footer>
    <div class="is-overlay hidden" id="is-overlay"><div class="is-panel" id="is-panel"></div></div>
  </section>

  <!-- ===================== 전투 ===================== -->
  <section id="screen-battle" class="screen">
    <div id="board-wrap">
      <canvas id="board"></canvas>
    </div>
    <div class="hud">
      <div class="hud-left">
        <button id="btn-gear" class="hud-sq" aria-label="메뉴"><span data-ico="gear"></span></button>
        <div class="hud-stage" id="hud-stage"></div>
      </div>
      <div class="hud-stats">
        <span class="stat"><i class="hud-ico enemy">◎</i><b id="hud-enemy">0/0</b></span>
        <span class="stat life"><i class="hud-ico" data-ico="defender"></i><b id="hud-life">3</b></span>
      </div>
      <div class="hud-btns">
        <button id="btn-speed" class="hud-sq speed">1X<small>▶</small><kbd>F</kbd></button>
        <button id="btn-pause" class="hud-sq">❚❚<kbd>Space</kbd></button>
      </div>
    </div>
    <div id="hint" class="hint hidden"></div>
    <div id="toast" class="toast hidden"></div>
    <div id="voice-line" class="voice-line hidden"></div>
    <div id="inspect" class="inspect hidden">
      <div class="ins-art" id="ins-art"></div>
      <div class="ins-top">
        <div class="ins-cls" id="ins-cls"></div>
        <div class="ins-name" id="ins-name"></div>
        <div class="ins-class" id="ins-class"></div>
        <div class="ins-row"><div class="ins-stats" id="ins-stats"></div><div class="ins-range" id="ins-range"></div></div>
      </div>
      <div class="ins-hp"><i id="ins-hp-fill"></i><span>체력</span><b id="ins-hp-text"></b></div>
      <div class="ins-tabs" id="ins-tabs"><button data-itab="skill" class="on">스킬</button><button data-itab="trait">특성</button><button data-itab="talent">재능</button></div>
      <div class="ins-body" id="ins-body"></div>
      <div class="ins-sp"><i id="ins-sp-fill"></i><span id="ins-sp-text"></span></div>
    </div>
    <div id="skill-cutin" class="cutin hidden"></div>
    <div id="op-ring" class="op-ring hidden">
      <div class="ring-diamond"></div>
      <button class="ring-btn retreat" id="ins-retreat" aria-label="철수"><span class="ring-ico">⤺</span><kbd>Q</kbd></button>
      <button class="ring-btn skill" id="ins-skill" aria-label="스킬 발동"></button>
    </div>
    <div class="rotate-hint">↻ 화면을 가로로 돌리면 맵이 크게 보입니다</div>
    <div class="deploy-bar">
      <div class="dp">
        <div class="dp-row"><span class="dp-ico">◆</span><span class="dp-num" id="dp-num">0</span></div>
        <div class="dp-bar"><i id="dp-fill"></i></div>
        <div class="dp-limit">배치 가능 인원: <b id="deploy-left">0</b></div>
      </div>
      <div id="cards" class="cards"></div>
    </div>
  </section>

  <!-- ===================== 오버레이 ===================== -->
  <div id="dialog" class="overlay dialog hidden">
    <button class="btn small dlg-skip" id="dlg-skip">건너뛰기 ▶▶</button>
    <div class="dlg-portrait" id="dlg-portrait"></div>
    <div class="dlg-box">
      <div class="dlg-name" id="dlg-name"></div>
      <div class="dlg-text" id="dlg-text"></div>
      <div class="dlg-next">▼</div>
    </div>
  </div>

  <div id="result" class="overlay center hidden">
    <div class="panel">
      <div class="result-title" id="result-title"></div>
      <div class="result-stars" id="result-stars"></div>
      <div class="result-info" id="result-info"></div>
      <div class="panel-btns" id="result-btns"></div>
    </div>
  </div>

  <div id="pause" class="overlay center hidden">
    <div class="panel">
      <div class="result-title">일시정지</div>
      <div class="panel-btns">
        <button class="btn primary" id="pause-resume">계속</button>
        <button class="btn" id="pause-sound">효과음 켜짐</button>
        <button class="btn hidden" id="pause-fullscreen">전체 화면</button>
        <button class="btn" id="pause-retry">다시 시작</button>
        <button class="btn danger" id="pause-quit">작전 포기</button>
      </div>
    </div>
  </div>

  <div id="modal" class="overlay center hidden">
    <div class="panel modal-panel">
      <button class="modal-close" id="modal-close" aria-label="닫기">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="gacha" class="overlay gacha hidden">
    <div class="gacha-stage" id="gacha-stage"></div>
    <button class="btn small gacha-skip" id="gacha-skip">SKIP ▶▶</button>
  </div>

  <div id="ui-toast" class="ui-toast hidden"></div>
</div>

<script src="data.js"></script>
<script src="is-data.js"></script>
<script src="is-relics.js"></script>
<script src="sfx.js"></script>
<script src="account.js"></script>
<script src="train.js"></script>
<script src="ui.js"></script>
<script src="shop.js"></script>
<script src="roguelike.js"></script>
<script src="game.js"></script>
</body>
</html>
